<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto Vitall</title>
    <!-- Tipografía moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0b1329;
            --primary-light: #1c2a52;
            --accent: #0066ff;
            --bg-color: #f4f6f9;
            --text-main: #2d3748;
            --text-muted: #718096;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f4f6f9 0%, #e2e8f0 100%);
            margin: 0;
            padding: 40px 15px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Contenedor principal perfectamente centrado */
        .hoja-documento {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            padding: 60px;
            box-shadow: 0 20px 40px rgba(11, 19, 41, 0.08);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        .hoja-documento::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        .encabezado-empresa {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 20px;
            margin-bottom: 35px;
        }

        .encabezado-empresa h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin: 0;
            font-weight: 700;
        }

        .tag-oficial {
            font-size: 0.75rem;
            background: #f0f4f8;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Estilos tipográficos limpios */
        .contenido-libre {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #4a5568;
        }

        .contenido-libre h2, .contenido-libre h3 {
            color: var(--primary);
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .contenido-libre p {
            margin-bottom: 20px;
        }

        .footer-hoja {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #edf2f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="hoja-documento">
        <div class="encabezado-empresa">
            <h1>Contacto Vitall</h1>
            <span class="tag-oficial">Documento Oficial</span>
        </div>

        <!-- Contenido limpio integrado directamente dentro de la hoja -->
        <div class="contenido-libre">
            <h2>Bienvenido</h2>
            <p>Hola Soy stiven</p>
        </div>

        <div class="footer-hoja">
            <span>© Contacto Vitall</span>
            <span>Plataforma Oficial</span>
        </div>
    </div>

</body>
</html>
