<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto Vitall</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #e4e7eb;
            margin: 0;
            padding: 40px 20px;
            color: #2d3748;
            display: flex;
            justify-content: center;
        }
        .hoja-documento {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            padding: 60px 70px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border-radius: 6px;
            box-sizing: border-box;
            min-height: 85vh;
        }
        .encabezado-empresa {
            border-bottom: 2px solid #0b1329;
            padding-bottom: 15px;
            margin-bottom: 40px;
        }
        .encabezado-empresa h1 {
            color: #0b1329;
            font-size: 1.8rem;
            margin: 0;
            font-weight: 700;
        }
        .contenido-libre h2 {
            color: #0b1329;
            margin-top: 30px;
            font-size: 1.4rem;
        }
        .contenido-libre p {
            line-height: 1.8;
            margin-bottom: 20px;
            font-size: 1.05rem;
            color: #4a5568;
        }
    </style>
</head>
<body>

    <div class="hoja-documento">
        <div class="encabezado-empresa">
            <h1>Contacto Vitall</h1>
        </div>

        <div class="contenido-libre">
            <h2>Documento Oficial</h2>
            <p>Este es el nuevo diseño limpio y profesional de tu página web. Ya no hay tablas viejas ni elementos molestos; ahora tienes una hoja en blanco lista para mostrar tu contenido de manera impecable.</p>
        </div>
    </div>

</body>
</html>
